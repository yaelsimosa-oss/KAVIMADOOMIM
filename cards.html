<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>כרטיסיות לשיחה: מה מתחיל זוגיות מיטיבה? | פורום נראות</title>
<style>
@font-face{font-family:'Assistant';font-weight:200 800;src:url(fonts/assistant-hebrew.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+FB1D-FB4F}
@font-face{font-family:'Assistant';font-weight:200 800;src:url(fonts/assistant-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:'Heebo';font-weight:100 900;src:url(fonts/heebo-hebrew.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+FB1D-FB4F}
@font-face{font-family:'Heebo';font-weight:100 900;src:url(fonts/heebo-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
:root{--teal:#164C4D;--ink:#0F3637;--coral:#F28F83;--coral-ink:#B5483B;--cream:#FAF8F3}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:#E9E5DA;font-family:'Assistant',sans-serif;color:var(--ink)}
.bar{position:sticky;top:0;z-index:5;background:var(--teal);color:#fff;padding:14px 24px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.bar h1{font:700 19px 'Heebo',sans-serif;margin:0;color:#fff}
.bar p{margin:0;font-size:15.5px;opacity:.9;flex:1;min-width:240px}
.bar button,.bar a{min-height:44px;padding:0 20px;border-radius:999px;border:1.5px solid #fff;background:transparent;color:#fff;font:600 16px 'Heebo',sans-serif;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.bar button.p{background:var(--coral);border-color:var(--coral);color:var(--ink)}
.bar button:focus-visible,.bar a:focus-visible{outline:3px solid #EAA24B;outline-offset:3px}
.sheet{width:210mm;height:297mm;margin:24px auto;background:#fff;padding:12mm 10mm;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:9mm;box-shadow:0 10px 30px -12px rgba(0,0,0,.25);position:relative}
.sheet .foot{position:absolute;bottom:4mm;left:0;right:0;text-align:center;font:500 8pt 'Heebo',sans-serif;color:#7b8f90}
.card{position:relative;border-radius:5mm;padding:9mm 8mm 8mm;display:flex;flex-direction:column;gap:4mm;overflow:hidden;outline:0.3mm dashed #9aa9a9;outline-offset:3mm}
.card .deco{position:absolute;width:44mm;height:44mm;border-radius:50%;background:rgba(255,255,255,.3);top:-16mm;left:-16mm}
.card .n{font:700 10pt 'Heebo',sans-serif;color:var(--teal);position:relative}
.card h2{font:800 22pt/1.1 'Heebo',sans-serif;color:var(--teal);margin:0;position:relative}
.card .x{font-size:12.5pt;line-height:1.5;margin:0}
.card .q{margin-top:auto;background:rgba(255,255,255,.8);border-radius:3.5mm;padding:4.5mm 5mm;font:600 12.5pt/1.4 'Heebo',sans-serif;color:var(--ink)}
.card .q b{display:block;font-size:9pt;color:var(--coral-ink);margin-bottom:1.5mm}
.card .brand{font:500 8pt 'Heebo',sans-serif;color:var(--teal);opacity:.75}
.cover{grid-column:1/-1;grid-row:1/-1;background:var(--cream);border-radius:5mm;padding:22mm 18mm;display:flex;flex-direction:column;gap:8mm}
.cover .k{font:600 12pt 'Heebo',sans-serif;color:var(--coral-ink)}
.cover h2{font:800 36pt/1.08 'Heebo',sans-serif;color:var(--teal);margin:0}
.cover p{font-size:14pt;line-height:1.6;margin:0;max-width:150mm}
.cover ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:4mm;max-width:160mm}
.cover li{display:flex;gap:3mm;align-items:center;font:600 13pt 'Heebo',sans-serif;color:var(--teal)}
.cover li i{width:9mm;height:9mm;border-radius:50%;display:grid;place-items:center;font:800 11pt 'Heebo';font-style:normal;color:var(--ink)}
.cover .how{margin-top:auto;border-top:0.4mm solid #d9d3c4;padding-top:6mm;font-size:12pt;color:#3f5758}
.cover .logo{width:62mm;height:auto;align-self:flex-start;border-radius:3mm}
@media screen and (max-width:860px){
  .sheet{width:auto;height:auto;margin:16px;grid-template-columns:1fr;grid-template-rows:none;padding:16px}
  .card{min-height:120vw;max-height:none}
  .cover{grid-column:auto;grid-row:auto}
  .cover ol{grid-template-columns:1fr}
}
@media print{
  @page{size:A4 portrait;margin:0}
  body{background:#fff}
  .bar{display:none}
  .sheet{margin:0;box-shadow:none;break-after:page}
  .sheet:last-child{break-after:auto}
}
</style>
</head>
<body>
<div class="bar" role="region" aria-label="פעולות הדפסה">
  <h1>כרטיסיות לשיחה – קובץ להדפסה</h1>
  <p>3 עמודי A4: עמוד פתיחה ושני עמודים עם 4 כרטיסיות בכל אחד. לשמירה כ-PDF לשימוש ללא חיבור, בחרו בחלון ההדפסה "שמירה כ-PDF" (Save as PDF) והפעילו "גרפיקת רקע".</p>
  <button class="p" onclick="window.print()">הדפסה / שמירה כ-PDF</button>
  <a href="index.html#ch6">חזרה למדריך</a>
</div>
<main id="sheets"></main>
<script src="guide-data.js"></script>
<script>
(function(){
  const C = window.GUIDE.cards, esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const foot = '<span class="foot">זוגיות מיטיבה · פורום נראות בשיתוף קווים אדומים · גזרו לאורך הקו המקווקו</span>';
  let html = `<section class="sheet" aria-label="עמוד פתיחה">
    <div class="cover">
      <img class="logo" src="assets/logo-niroot-trim.png" alt="פורום נראות – ארגונים למען צעירים וצעירות במצבי סיכון">
      <span class="k">כרטיסיות לשיחה</span>
      <h2>מה מתחיל זוגיות מיטיבה?</h2>
      <p>הכרטיסיות נועדו לשמש כלי עזר לפתיחת שיחה אישית או קבוצתית. אפשר לבחור כרטיסייה אחת שמתאימה למפגש, להציג את השאלה ולתת לצעירים ולצעירות מקום לחשוב, לשתף ולהביע עמדות.</p>
      <ol>${C.map((c,i)=>`<li><i style="background:${c.bg}">${i+1}</i>${esc(c.t)}</li>`).join('')}</ol>
      <div class="how">מתוך: זוגיות מיטיבה – כלי לפתיחת שיחה ולתגובה ראשונית. מדריך עבודה לאנשי ונשות שטח | פורום נראות בשיתוף קווים אדומים<br><br><b>תנאי שימוש:</b> המדריך מיועד לשימוש חופשי, פנימי ומקצועי של ארגוני פורום נראות וצוותי השטח המלווים צעירים וצעירות. אין לעשות בחוברת שימוש מסחרי. בכל פרסום או ציטוט מתוך המדריך, יש לציין קרדיט לפורום נראות וליוזמת קווים אדומים.</div>
    </div>${foot}</section>`;
  // 6 cards → pages of 4 (4 + 2)
  for (let p = 0; p < C.length; p += 4) {
    html += `<section class="sheet" aria-label="כרטיסיות ${p+1}–${Math.min(p+4,C.length)}">` +
      C.slice(p, p + 4).map((c, j) => { const i = p + j; return `
      <article class="card" style="background:${c.bg}">
        <span class="deco" aria-hidden="true"></span>
        <span class="n">כרטיסייה ${i+1}</span>
        <h2>${esc(c.t)}</h2>
        <p class="x">${esc(c.x)}</p>
        <div class="q"><b>שאלה לשיחה</b>${esc(c.q)}</div>
        <span class="brand">זוגיות מיטיבה · פורום נראות</span>
      </article>`; }).join('') + foot + `</section>`;
  }
  document.getElementById('sheets').innerHTML = html;
  if (new URLSearchParams(location.search).get('print') === '1') {
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(() => window.print(), 300));
  }
})();
</script>
</body>
</html>
